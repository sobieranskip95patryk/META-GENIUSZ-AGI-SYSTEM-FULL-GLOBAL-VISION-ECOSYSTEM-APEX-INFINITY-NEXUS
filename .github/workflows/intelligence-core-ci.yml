name: intelligence-core CI

on:
  push:
    paths:
      - 'intelligence_core/**'
  pull_request:
    paths:
      - 'intelligence_core/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r intelligence_core/requirements.txt
      - name: Run tests
        working-directory: intelligence_core
        run: |
          pytest tests/unit -q
