# Docker Compose for GOK:AI MTaQuest Integration
# Purpose: Local development & testing environment
# Services: MTaQuest Server, Neo4j, Redis, API Server

version: '3.8'

services:
  # Neo4j Graph Database (for Long-Term Memory graph storage)
  neo4j:
    image: neo4j:5.10
    container_name: gok-neo4j
    ports:
      - "7687:7687"
      - "7474:7474"
    environment:
      NEO4J_AUTH: neo4j/mtaquest2026
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gok-network

  # Redis Cache (for MTaQuest state synchronization)
  redis:
    image: redis:7-alpine
    container_name: gok-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gok-network

  # MTaQuest Server (HDP + IQE + VSE integration)
  mtaquest-server:
    build:
      context: .
      dockerfile: INFRA/Dockerfile.mtaquest
    container_name: gok-mtaquest-server
    ports:
      - "5000:5000"
    environment:
      FLASK_APP: INFRA/Services/mtaquest_server.py
      FLASK_ENV: development
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: mtaquest2026
      REDIS_URL: redis://redis:6379
      PYTHONUNBUFFERED: 1
      PYTHONIOENCODING: utf-8
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - gok-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Server (Bridge to Gemini & GCP)
  api-server:
    build:
      context: .
      dockerfile: INFRA/Dockerfile.api
    container_name: gok-api-server
    ports:
      - "8000:8000"
    environment:
      MTAQUEST_SERVER_URL: http://mtaquest-server:5000
      PYTHONUNBUFFERED: 1
      PYTHONIOENCODING: utf-8
    depends_on:
      mtaquest-server:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - gok-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  neo4j-data:
    driver: local
  neo4j-logs:
    driver: local
  redis-data:
    driver: local

networks:
  gok-network:
    driver: bridge
